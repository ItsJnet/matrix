<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RBLXTools</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
        #080b12;
    background-size: 40px 40px;
    color: white;
}

.container {
    text-align: center;
    padding-top: 120px;
}

.logo {
    font-size: 60px;
    font-weight: 800;
    color: #4da6ff;
    text-shadow: 0 0 25px #4da6ff;
}

.subtitle {
    margin-top: 20px;
    color: #aaa;
    font-size: 20px;
}

.buttons {
    margin-top: 40px;
}

button {
    background: #1677ff;
    color: white;
    border: none;
    padding: 15px 35px;
    margin: 10px;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #3390ff;
}

.cards {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 80px;
}

.card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 25px;
    border-radius: 15px;
    width: 220px;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        RBLXTools
    </div>

    <div class="subtitle">
        Powerful Roblox tools. Simple and fast.
    </div>

    <div class="buttons">
        <button>Get Started</button>
        <button>Discord</button>
    </div>


    <div class="cards">

        <div class="card">
            <h2>Value Checker</h2>
            <p>Coming soon</p>
        </div>

        <div class="card">
            <h2>Trade Tools</h2>
            <p>Coming soon</p>
        </div>

        <div class="card">
            <h2>More Tools</h2>
            <p>Coming soon</p>
        </div>

    </div>

</div>

</body>
</html>
